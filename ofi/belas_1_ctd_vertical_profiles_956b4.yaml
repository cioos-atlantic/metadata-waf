identification:
  abstract:
    en: Quality-controlled shipborne CTD profile observations collected during cruise
      CE22009 aboard the R/V Celtic Explorer from 2022-05-18 to 2022-06-02. The dataset
      includes cast identifiers, station names, location, time, depth, pressure, dual-channel
      temperature, conductivity, salinity, potential temperature, sigma-theta, sound
      velocity, dissolved oxygen, turbidity, fluorescence, transmissometer/voltage
      channels, and corrected chlorophyll.
    fr: "Observations de profils CTD embarqu\xE9s et contr\xF4l\xE9s en termes de\
      \ qualit\xE9, collect\xE9es lors de la croisi\xE8re CE22009 \xE0 bord du R/V\
      \ Celtic Explorer du 18 mai 2022 au 2 juin 2022. Le jeu de donn\xE9es comprend\
      \ des identifiants de profile, des noms de stations, la localisation, l'heure,\
      \ la profondeur, la pression, la temp\xE9rature \xE0 double canal, la conductivit\xE9\
      , la salinit\xE9, la temp\xE9rature potentielle, le sigma-theta, la vitesse\
      \ du son, l'oxyg\xE8ne dissous, la turbidit\xE9, la fluorescence, les canaux\
      \ du transmissom\xE8tre/de la tension et la chlorophylle corrig\xE9e."
    translations:
      fr:
        message: Cohere command-a-translate-08-2025, cioos-commons@4c76a84
        verified: false
