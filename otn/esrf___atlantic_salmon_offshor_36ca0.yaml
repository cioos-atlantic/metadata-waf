identification:
  title:
    en: ESRF - Atlantic Salmon Offshore Tracking Project - Ocean Drifters
    fr: FEE - Projet de suivi du saumon de l'Atlantique - Ocean Drifters
    translations:
      fr:
        message: text translated using the Amazon translate service / texte traduit
          à l'aide du service de traduction Amazon
        verified: false
  abstract:
    en: This collaborative research project will use acoustic and satellite telemetry
      to determine when, where and for how long Atlantic salmon from three different
      life stages (post-smolt, kelts returning to sea to recondition, and multi-sea
      winter adults) are in the Eastern Canadian offshore regions (Environmental Studies
      Research Fund [ESRF] Regions 8 to 15) of interest for oil and gas development
      to inform regulatory decision-making and future project development. This research
      project has been developed and is being implemented collaboratively with First
      Nations and partners from academia, the NGO sector, government and the public.
      The project is led by the Department of Fisheries and Oceans (Martha Robertson,
      Principal Investigator). Results will contribute significantly to our currently
      limited understanding of how Atlantic salmon use the marine areas off Eastern
      Canada and support evidence-based decision making and co-development of best
      operational practices to minimize potential adverse impacts of oil and gas activities
      on Atlantic salmon.
    fr: Ce projet de recherche collaboratif utilisera la télémétrie acoustique et
      satellitaire pour déterminer quand, où et pendant combien de temps des saumons
      de l'Atlantique de trois stades de vie différents (saumoneaux, kelts retournant
      en mer pour se remettre en forme et adultes hivernaux multimarins) vivent dans
      les régions extracôtières de l'est du Canada (régions 8 à 15 du Fonds d'études
      environnementales [FEE]) présentant un intérêt pour l'exploitation pétrolière
      et gazière afin d'éclairer la prise de décisions réglementaires et le développement
      de projets futurs. Ce projet de recherche a été élaboré et est mis en œuvre
      en collaboration avec les Premières Nations et des partenaires du milieu universitaire,
      du secteur des ONG, du gouvernement et du public. Le projet est dirigé par le
      ministère des Pêches et des Océans (Martha Robertson, chercheuse principale).
      Les résultats contribueront de manière significative à notre compréhension actuellement
      limitée de la façon dont le saumon de l'Atlantique utilise les zones marines
      au large de l'est du Canada et appuieront la prise de décisions fondées sur
      des preuves et l'élaboration conjointe de meilleures pratiques opérationnelles
      afin de minimiser les impacts négatifs potentiels des activités pétrolières
      et gazières sur le saumon de l'Atlantique.
    translations:
      fr:
        verified: true
