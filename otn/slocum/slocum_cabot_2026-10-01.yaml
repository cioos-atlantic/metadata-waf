identification:
  abstract:
    en: This glider was prepared with a DMON2 (Woods Hole Oceanographic Institution),
      Williamson Shadowgraph camera, Seabird ecopucks, an RBR CTD, and an Innovasea
      VMT mounted near the tail and thruster. It was deployed southeast of Grand Manan
      Island (Grand Manan basin) in the middle of the gyre for ~30-day deployment
      during October 2026.
    fr: Ce planeur a été préparé avec un DMON2 (Woods Hole Oceanographic Institution),
      une caméra Williamson Shadowgraph, des ecopucks Seabird, un RBR CTD et un Innovasea
      VMT monté près de la queue et du propulseur. Il a été déployé au sud-est de
      l’île Grand Manan (bassin de Grand Manan) au milieu du gyre pour un déploiement
      d’environ 30 jours en octobre 2026.
  acknowledgement:
    en: The study was funded by the Ocean Tracking Network in collaboration with Kim
      Davies at the University of New Brunswick. The Ocean Tracking Network led this
      project and their glider team expertly prepared, deployed, piloted and recovered
      the glider. The Williamson Shadowgraph camera was loaned to the Ocean Tracking
      Network by Kim Davies at the University of New Brunswick. Thank you to the vessel
      captains who supported deployment and recovery.
    fr: L'étude a été financée par l'Ocean Tracking Network en collaboration avec
      Kim Davies de l'Université du Nouveau-Brunswick. L'Ocean Tracking Network a
      dirigé ce projet et son équipe de planeurs a préparé, déployé, piloté et récupéré
      le planeur de manière experte. La caméra Williamson Shadowgraph a été prêtée
      au Ocean Tracking Network par Kim Davies de l'Université du Nouveau-Brunswick.
      Merci aux capitaines des navires qui ont soutenu le déploiement et la récupération.
