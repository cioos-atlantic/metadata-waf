identification:
  abstract:
    en: "Presented collected with RBRconcertoCTD a set of oceanographic data, including\
      \ variables: conductivity, temperature, practical salinity, specific density,\
      \ dissolved oxygen, transmittance, chlorophyll-a, fDOM at sampling rate 8Hz\
      \ in the Gulf of St. Lawrence at the moorings of SV Oceanolog on the route:\
      \ Rivi\xE8re-du-Loup - Gaspe - Magdalen Is. - Cape North. This is a pilot stage's\
      \ set of high-accuracy and resolution oceanographic data collected during the\
      \ citizen science project Sail for Science underway to the Caribbean: www.sailforscience.com"
    fr: "RBRConcertoCTD a pr\xE9sent\xE9 un ensemble de donn\xE9es oc\xE9anographiques,\
      \ comprenant des variables\_: conductivit\xE9, temp\xE9rature, salinit\xE9 pratique,\
      \ densit\xE9 sp\xE9cifique, oxyg\xE8ne dissous, transmittance, chlorophylle-a,\
      \ FDom \xE0 une fr\xE9quence d'\xE9chantillonnage de 8 Hz dans le golfe du Saint-Laurent\
      \ aux amarres de SV Oceanolog sur la route\_: Rivi\xE8re-du-Loup - Gasp\xE9\
      \ - \xCEles-de-la-Madeleine - Cap Nord. Il s'agit d'un ensemble de donn\xE9\
      es oc\xE9anographiques de haute pr\xE9cision et de r\xE9solution recueillies\
      \ au cours d'une phase pilote dans le cadre du projet de science citoyenne Sail\
      \ for Science en cours dans les Cara\xEFbes\_: www.sailforscience.com"
    translations:
      fr:
        message: "text translated using the Amazon translate service / texte traduit\
          \ \xE0 l'aide du service de traduction Amazon"
        verified: false
