distribution:
- description:
    en: "Our mission has two main goals:  1.Collect valuable ocean data sustainably:\
      \ We gather high-quality oceanographic data using our near-zero-emission sailboat\
      \ and submit it to global ocean data repositories, where it becomes freely available\
      \ to scientists worldwide. 2.Empower sailors as citizen scientists: We inspire\
      \ and engage the global community of cruising sailors to take part in ocean\
      \ research \u2014 demonstrating modern CTD measuring system, teaching how to\
      \ use them onboard, and showing how every voyage can contribute to real science."
  name:
    en: Citizen Science project "Sail for Science"
  url: www.sailforscience.com
