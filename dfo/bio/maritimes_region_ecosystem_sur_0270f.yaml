identification:
  abstract:
    en: "The Fisheries and Oceans Canada (DFO) first implemented annual, standardized\
      \ groundfish surveys (now referred to as ecosystem surveys) in the summer of\
      \ 1970. These surveys consist of research vessel survey data collected to monitor\
      \ the distribution and abundance of fish and invertebrates throughout the Scotian\
      \ Shelf, Bay of Fundy and Georges Bank. The surveys follow a stratified random\
      \ sampling design, and includes sampling of fish and invertebrates using a bottom\
      \ trawl. These survey data are the primary data source for monitoring trends\
      \ in fish species distribution, abundance, and biological conditions within\
      \ the region. \u201CSpring\u201D cruises occur in January, February, March and\
      \ April, and focus on Georges Bank. \u201CSummer\u201D cruises occur in May,\
      \ June, July and August and these focus on the Scotian Shelf and Bay of Fundy.\
      \ A vessel change occurred in 1982 when the A.T. Cameron was replaced by the\
      \ Lady Hammond and in 1983 when the Alfred Needler became the principal survey\
      \ vessel.  Now the Captain Jacques Cartier, built in 2019 and delivered in 2020,\
      \ will serve as the primary offshore fishery science vessels in the Maritimes\
      \ Region.  \n\nAlso as part of these surveys, physical, chemical, and biological\
      \ oceanographic observations are collected as part of the Atlantic Zonal Monitoring\
      \ Program (AZMP).  AZMP sampling is conducted according to standard procedures\
      \ (see https://cat.fsl-bsf.scitech.gc.ca/record=b3951030~S6) and includes the\
      \ collection of CTD profiles and water samples for the determination of physical\
      \ (e.g., T, S), chemical (e.g., nutrients, oxygen, pH), and biological (chl\
      \ a) variables and vertical ring net tows. The data collected are synthesized\
      \ into two annual reports on the physical and chemical/biological changes in\
      \ the Maritimes Region.  AZMP aims to detect and track climate change and variability\
      \ in the northwest Atlantic, evaluating changes in the physical, chemical and\
      \ biological ocean properties and predator-prey dynamics of marine resources,\
      \ thereby enhancing Canada's ability to understand, describe, and forecast the\
      \ state of the marine ecosystem\u201D. This record includes only hydrographic/CTD\
      \ data collected during the spring and summer ecosystem surveys, conducted between\
      \ 1998 to present."
    fr: "P\xEAches et Oc\xE9ans Canada (MPO) a mis en \u0153uvre pour la premi\xE8\
      re fois des relev\xE9s annuels normalis\xE9s du poisson de fond (maintenant\
      \ appel\xE9s relev\xE9s des \xE9cosyst\xE8mes) au cours de l'\xE9t\xE9 1970.\
      \ Ces relev\xE9s consistent en des donn\xE9es recueillies par des navires de\
      \ recherche afin de surveiller la r\xE9partition et l'abondance des poissons\
      \ et des invert\xE9br\xE9s sur le plateau n\xE9o-\xE9cossais, la baie de Fundy\
      \ et le banc Georges. Les relev\xE9s suivent un plan d'\xE9chantillonnage al\xE9\
      atoire stratifi\xE9 et comprennent l'\xE9chantillonnage de poissons et d'invert\xE9\
      br\xE9s \xE0 l'aide d'un chalut de fond. Ces donn\xE9es d'enqu\xEAte constituent\
      \ la principale source de donn\xE9es pour le suivi des tendances de la distribution,\
      \ de l'abondance et des conditions biologiques des esp\xE8ces de poissons dans\
      \ la r\xE9gion. Les croisi\xE8res \xAB\_printani\xE8res\_\xBB ont lieu en janvier,\
      \ f\xE9vrier, mars et avril et se concentrent sur le banc Georges. Les croisi\xE8\
      res \xAB\_estivales\_\xBB ont lieu en mai, juin, juillet et ao\xFBt et se concentrent\
      \ sur le plateau n\xE9o-\xE9cossais et la baie de Fundy. Un changement de navire\
      \ s'est produit en 1982 lorsque l'A.T. Cameron a \xE9t\xE9 remplac\xE9 par le\
      \ Lady Hammond et en 1983 lorsque l'Alfred Needler est devenu le principal navire\
      \ de prospection. Aujourd'hui, le Captain Jacques Cartier, construit en 2019\
      \ et livr\xE9 en 2020, sera le principal navire hauturier de sciences halieutiques\
      \ dans la r\xE9gion des Maritimes. \n\nDans le cadre de ces relev\xE9s, des\
      \ observations oc\xE9anographiques physiques, chimiques et biologiques sont\
      \ recueillies dans le cadre du Programme de surveillance de la zone atlantique\
      \ (PMZA). L'\xE9chantillonnage du PMZA est effectu\xE9 selon des proc\xE9dures\
      \ standard (voir https://cat.fsl-bsf.scitech.gc.ca/record=b3951030~S6) et comprend\
      \ la collecte de profils CTD et d'\xE9chantillons d'eau pour la d\xE9termination\
      \ des variables physiques (par exemple, T, S), chimiques (par exemple, nutriments,\
      \ oxyg\xE8ne, pH) et biologiques (chl a) et verticales tractions de filet \xE0\
      \ anneaux. Les donn\xE9es recueillies sont synth\xE9tis\xE9es dans deux rapports\
      \ annuels sur les changements physiques et chimiques/biologiques dans la r\xE9\
      gion des Maritimes. Le PMZA vise \xE0 d\xE9tecter et \xE0 suivre le changement\
      \ et la variabilit\xE9 climatiques dans l'Atlantique Nord-Ouest, en \xE9valuant\
      \ les changements dans les propri\xE9t\xE9s physiques, chimiques et biologiques\
      \ de l'oc\xE9an et dans la dynamique pr\xE9dateur-proie des ressources marines,\
      \ am\xE9liorant ainsi la capacit\xE9 du Canada \xE0 comprendre, d\xE9crire et\
      \ pr\xE9voir l'\xE9tat de la mer \xE9cosyst\xE8me\_\xBB. Ce dossier comprend\
      \ uniquement les donn\xE9es hydrographiques/CTD recueillies au cours des relev\xE9\
      s \xE9cosyst\xE9miques du printemps et de l'\xE9t\xE9, r\xE9alis\xE9s entre\
      \ 1998 et aujourd'hui."
