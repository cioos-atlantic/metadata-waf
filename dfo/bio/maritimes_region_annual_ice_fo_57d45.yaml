identification:
  abstract:
    en: 'The annual Ice Forecast Hydrographic Survey Gulf Of St. Lawrence historic
      data set is from 1972 to 1995.  It was an annual program with missions in the
      months of  November - January covering 35 stations in the Gulf Of St. Lawrence.
      The purpose was to obtain temperature-salinity measurements in the upper 100
      m of water from 35 stations in the Gulf of St. Lawrence for preparation of seasonal
      ice outlook by the Ice Climatology Branch and later the Ice Forecast Central
      Office of the Department of Environment Atmospheric Environment Service.  The
      data measured included: profile CTD, dissolved oxygen and nutrient data, oxygen
      isotope, Ra isotope, sediment cores,  satellite transmitting thermistor buoys
      to monitor the cooling, and doppler current profiler to measure ice motion and
      currents.'
    fr: "L'ensemble de donn\xE9es historiques annuel du Service hydrographique de\
      \ pr\xE9vision des glaces pour le golfe du Saint-Laurent couvre la p\xE9riode\
      \ de 1972 \xE0 1995. Il s'agissait d'un programme annuel avec des missions au\
      \ cours des mois de novembre \xE0 janvier couvrant 35 stations dans le golfe\
      \ du Saint-Laurent. L'objectif \xE9tait d'obtenir des mesures de la temp\xE9\
      rature et de la salinit\xE9 dans les 100 m sup\xE9rieurs de l'eau \xE0 partir\
      \ de 35 stations dans le golfe du Saint-Laurent pour la pr\xE9paration des pr\xE9\
      visions saisonni\xE8res des glaces par la Direction de la climatologie des glaces\
      \ et plus tard par le Bureau central de pr\xE9vision des glaces du Service de\
      \ l'environnement atmosph\xE9rique du minist\xE8re de l'Environnement. Les donn\xE9\
      es mesur\xE9es comprenaient\_: le profil CTD, les donn\xE9es sur l'oxyg\xE8\
      ne dissous et les nutriments, l'isotope de l'oxyg\xE8ne, l'isotope Ra, des carottes\
      \ de s\xE9diments, des bou\xE9es thermistrices de transmission par satellite\
      \ pour surveiller le refroidissement et un profileur de courant Doppler pour\
      \ mesurer le mouvement des glaces et les courants."
