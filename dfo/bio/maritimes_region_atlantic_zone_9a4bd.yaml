identification:
  abstract:
    en: The Atlantic Zone Monitoring Program (AZMP) was implemented in 1998 with the
      aim of detecting and tracking climate change and variability in the northwest
      Atlantic, evaluating changes in the physical, chemical and biological ocean
      properties and predator-prey dynamics of marine resources, thereby enhancing
      Canada's ability to understand, describe, and forecast the state of the marine
      ecosystem. AZMP's sampling scheme in the Maritimes Region involves oceanographic
      sampling at two high-frequency (biweekly to monthly) fixed coastal stations,
      biannual sampling at stratified-random locations during DFO-led Ecosystem Trawl
      Surveys, biannual sampling along fixed cross-shelf sections (Cabot Strait Line,
      Louisbourg Line, Halifax Line, Browns Bank Line, and the Northeast Channel);
      the latter of which may also include opportunistic sampling at stations in the
      Laurentian Channel, Gulf of Maine, and various Marine Protected Areas (MPAs)
      in support of ancillary research programs and initiatives. AZMP sampling is
      conducted according to standard procedures (see https://cat.fsl-bsf.scitech.gc.ca/record=b3951030~S6)
      and includes the collection of CTD profiles and water samples for the determination
      of physical (e.g., T, S), chemical (e.g., nutrients, oxygen, pH), and biological
      (chl a) variables and vertical ring net tows. The data collected are synthesized
      into two annual reports on the physical and chemical/biological changes in the
      Maritimes Region, and are also used to evaluate changes across the Atlantic
      zone.
    fr: "Le Programme de surveillance de la zone atlantique (PMZA) a \xE9t\xE9 mis\
      \ en \u0153uvre en 1998 dans le but de d\xE9tecter et de suivre les changements\
      \ climatiques et la variabilit\xE9 dans l'Atlantique Nord-Ouest, d'\xE9valuer\
      \ les changements dans les propri\xE9t\xE9s physiques, chimiques et biologiques\
      \ de l'oc\xE9an et la dynamique pr\xE9dateur-proie des ressources marines, am\xE9\
      liorant ainsi le Canada. de comprendre, de d\xE9crire et de pr\xE9voir l'\xE9\
      tat de l'\xE9cosyst\xE8me marin. Le sch\xE9ma d'\xE9chantillonnage de l'AZMP\
      \ dans la r\xE9gion des Maritimes comprend un \xE9chantillonnage oc\xE9anographique\
      \ \xE0 deux stations c\xF4ti\xE8res fixes \xE0 haute fr\xE9quence (bihebdomadaire\
      \ \xE0 mensuelle), un \xE9chantillonnage semestriel \xE0 des emplacements stratifi\xE9\
      s al\xE9atoires pendant les relev\xE9s au chalut \xE9cosyst\xE9mique dirig\xE9\
      s par le MPO, un \xE9chantillonnage biannuel le long de sections transversales\
      \ fixes (Cabot Strait Line, Louisbourg Line, Halifax Line, Browns Bank Line\
      \ et Northeast Channel)\_; ces derniers peuvent \xE9galement inclure un \xE9\
      chantillonnage opportuniste dans les stations du chenal Laurentien, du golfe\
      \ du Maine et de diverses aires marines prot\xE9g\xE9es (AMP) \xE0 l'appui de\
      \ programmes et d'initiatives de recherche auxiliaire. L'\xE9chantillonnage\
      \ AZMP est effectu\xE9 conform\xE9ment aux proc\xE9dures normalis\xE9es (voir\
      \ https://cat.fsl-bsf.scitech.gc.ca/record=b3951030~S6) et comprend la collecte\
      \ de profils CTD et d'\xE9chantillons d'eau pour la d\xE9termination des variables\
      \ physiques (p. ex. T, S), chimiques (nutriments, oxyg\xE8ne, pH) et biologiques\
      \ (chl a) et verticales remorquage de filet d'anneau. Les donn\xE9es recueillies\
      \ sont synth\xE9tis\xE9es dans deux rapports annuels sur les changements physiques\
      \ et chimiques et biologiques dans la r\xE9gion des Maritimes, et sont \xE9\
      galement utilis\xE9es pour \xE9valuer les changements dans la zone atlantique."
