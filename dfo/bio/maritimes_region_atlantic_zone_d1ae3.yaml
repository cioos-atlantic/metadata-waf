identification:
  abstract:
    en: "The Atlantic Zone Monitoring Program (AZMP) was implemented in 1998 with\
      \ the aim of detecting and tracking climate change and variability in the northwest\
      \ Atlantic, evaluating changes in the physical, chemical and biological ocean\
      \ properties and predator-prey dynamics of marine resources, thereby enhancing\
      \ Canada's ability to understand, describe, and forecast the state of the marine\
      \ ecosystem. AZMP's sampling scheme in the Maritimes Region involves oceanographic\
      \ sampling at two high-frequency (biweekly to monthly) fixed coastal stations,\
      \ biannual sampling at stratified-random locations during DFO-led Ecosystem\
      \ Trawl Surveys, biannual sampling along fixed cross-shelf sections (Cabot Strait\
      \ Line, Louisbourg Line, Halifax Line, Browns Bank Line, and the Northeast Channel);\
      \ the latter of which may also include opportunistic sampling at stations in\
      \ the Laurentian Channel, Gulf of Maine, and various Marine Protected Areas\
      \ (MPAs) in support of ancillary research programs and initiatives. \nThe data\
      \ collected are synthesized into two annual reports on the physical and chemical/biological\
      \ changes in the Maritimes Region, and are also used to evaluate changes across\
      \ the Atlantic zone."
    fr: "Le Programme de surveillance de la zone Atlantique (AZMP) a \xE9t\xE9 mis\
      \ en \u0153uvre en 1998 dans le but de d\xE9tecter et de suivre les changements\
      \ et la variabilit\xE9 climatiques dans l'Atlantique Nord-Ouest, d'\xE9valuer\
      \ les changements dans les propri\xE9t\xE9s physiques, chimiques et biologiques\
      \ des oc\xE9ans et la dynamique pr\xE9dateur-proie des ressources marines, am\xE9\
      liorant ainsi la capacit\xE9 du Canada \xE0 comprendre, d\xE9crire et pr\xE9\
      voir l'\xE9tat de l'\xE9cosyst\xE8me marin. Le plan d'\xE9chantillonnage de\
      \ l'AZMP dans la r\xE9gion des Maritimes comprend un \xE9chantillonnage oc\xE9\
      anographique dans deux stations c\xF4ti\xE8res fixes \xE0 haute fr\xE9quence\
      \ (bihebdomadaire \xE0 mensuelle), un \xE9chantillonnage semestriel \xE0 des\
      \ emplacements al\xE9atoires stratifi\xE9s lors des relev\xE9s au chalut \xE9\
      cosyst\xE9mique men\xE9s par le MPO, un \xE9chantillonnage semestriel le long\
      \ de sections transversales fixes du plateau (ligne du d\xE9troit de Cabot,\
      \ ligne Louisbourg, ligne Halifax, ligne Browns Bank et canal nord-est)\_; ce\
      \ dernier volet peut \xE9galement inclure un \xE9chantillonnage opportuniste\
      \ dans des stations situ\xE9es dans les Laurentides Manche, golfe du Maine et\
      \ diverses aires marines prot\xE9g\xE9es (ZPM) \xE0 l'appui des activit\xE9\
      s auxiliaires programmes et initiatives de recherche. \nLes donn\xE9es recueillies\
      \ sont synth\xE9tis\xE9es dans deux rapports annuels sur les changements physiques\
      \ et chimiques/biologiques dans la r\xE9gion des Maritimes et sont \xE9galement\
      \ utilis\xE9es pour \xE9valuer les changements dans la zone atlantique."
