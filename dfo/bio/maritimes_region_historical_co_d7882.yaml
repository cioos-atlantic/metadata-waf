identification:
  abstract:
    en: Historical coastal missions in which DFO Bedford Institute of Oceanography
      participated in between 1969 and present which collected rosette vertical profile
      data. These missions were part of various projects in several coastal areas
      around Nova Scotia and Southern New Brunswick.
    fr: "Missions c\xF4ti\xE8res historiques auxquelles l'Institut oc\xE9anographique\
      \ de Bedford du MPO a particip\xE9 entre 1969 et aujourd'hui et qui ont permis\
      \ de recueillir des donn\xE9es de profil vertical par rosette. Ces missions\
      \ s'inscrivaient dans le cadre de divers projets dans plusieurs zones c\xF4\
      ti\xE8res de la Nouvelle-\xC9cosse et du sud du Nouveau-Brunswick."
