identification:
  abstract:
    en: Historical missions to the Arctic region in which DFO Bedford Institute of
      Oceanography participated in between 1975 and 1990 and one mission in 2013.
      These missions were part of various projects and visited several areas within
      the Arctic such as;  Hudson Bay, James Bay, Baffin Bay, Baffin Island Fjords,  Lancaster
      Sound, Davis Strait, Hudson Strait,  Labrador Sea, Northwest Passage, Greenland
      and the Norwegian Sea.
    fr: "Missions historiques dans la r\xE9gion arctique auxquelles l'Institut oc\xE9\
      anographique de Bedford du MPO a particip\xE9 entre 1975 et 1990 et une mission\
      \ en 2013. Ces missions faisaient partie de divers projets et ont visit\xE9\
      \ plusieurs r\xE9gions de l'Arctique, notamment la baie d'Hudson, la baie James,\
      \ la baie de Baffin, les fjords de l'\xEEle de Baffin, le d\xE9troit de Lancaster,\
      \ le d\xE9troit de Davis, le d\xE9troit d'Hudson, la mer du Labrador, le passage\
      \ du Nord-Ouest, le Groenland et la mer de Norv\xE8ge."
