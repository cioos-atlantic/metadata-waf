identification:
  abstract:
    en: "The Atlantic Zone Off-Shelf Monitoring Program (AZOMP) collects and analyzes\
      \ physical, chemical, and biological oceanographic observations from the continental\
      \ slope and deep basins of the Northwest Atlantic, with the overarching goal\
      \ of monitoring variability in ocean climate and plankton affecting ecosystems\
      \ off Atlantic Canada and climate systems at both regional and global scales.\
      \ \n\nAnnual measurements in the Labrador Sea began in 1990 as a contribution\
      \ to the World Ocean Circulation Experiment (WOCE) and have evolved into a multidisciplinary\
      \ regional monitoring effort and part of the Global Ocean Ship-based Hydrographic\
      \ Investigations Program (GO-SHIP).\n\nAZOMP's sampling scheme off Atlantic\
      \ Canada and the Labrador Sea involves annual sampling of both the Atlantic\
      \ Repeat 7-West (AR7W) line, a 880 km-line running across the Labrador Sea from\
      \ Labrador to Greenland coast and extended Halifax Line, deep-water stations\
      \ over the Scotian Slope and Rise located at the end of AZMP\u2019s Halifax\
      \ Line. Opportunistic sampling also may occur at stations in the Strait of Belle\
      \ Ilse, station 27, Labrador Shelf, and OSNAP West line in support of ancillary\
      \ research programs and initiatives. AZOMP sampling is conducted according to\
      \ standard Go-Ship protocols  (https://www.go-ship.org/HydroMan.html) and includes:\
      \ 1- the collection of CTD and Lowered-ADCP profiles and water samples for the\
      \ determination of physical (e.g., T, S, currents), chemical (e.g., nutrients,\
      \ Carbonate system, transient gases for water mass determination and/or ventilation\
      \ and carbon sequestration studies), and biological (e.g., chl a, Primary production\
      \ and optical properties) variables; 2-  Stratified multi net tows for zooplankton;\
      \  and 3- vertical ring net tows for plankton. In addition XBTs and Argo floats\
      \ are commonly deployed and vessel-mounted ADCP is used to water masses structures\
      \ at a smaller scale. The data collected are synthesized into annual reports\
      \ on the physical, chemical and biological changes in Atlantic Canadian waters\
      \ and the Labrador Sea. One primary focus is on changes in the intensity of\
      \ winter overturning of surface and intermediate-depth waters resulting in deep\
      \ water mass formation and is part of the thermohaline circulation that affects\
      \ the global climate. Convection also transfers atmospheric gases from the surface\
      \ to intermediate depths, reducing the rate of increase of carbon dioxide in\
      \ the atmosphere but increasing the acidity of the ocean."
    fr: "Le Programme de Monitorage de la Zone Atlantique au large du plateau continental\
      \ (PMZAO) recueille et analyse les observations oc\xE9anographiques physiques,\
      \ chimiques et biologiques du talus continental et des eaux profondes de l'Atlantique\
      \ Nord-Ouest, dans le but global de monitorer la variabilit\xE9 du climat oc\xE9\
      anique et du plancton affectant les \xE9cosyst\xE8mes au large des c\xF4tes\
      \ atlantiques canadiennes et des syst\xE8mes climatiques \xE0 l'\xE9chelle r\xE9\
      gionale et globale. \n\nLes mesures annuelles dans la mer du Labrador ont d\xE9\
      but\xE9 en 1990 en tant que contribution \xE0 la \xAB World Ocean Circulation\
      \ Experiment \xBB (WOCE) et ont \xE9volu\xE9 en un effort de monitorage r\xE9\
      gional multidisciplinaire faisant partie du r\xE9seau Global Ocean Ship-based\
      \ Hydrographic Investigations Program (GO-SHIP) (https://www.go-ship.org/HydroMan.html).\n\
      \nLe plan d'\xE9chantillonnage du PMZAO dans le Canada atlantique et  la mer\
      \ du Labrador comprend un \xE9chantillonnage annuel de l\u2019Atlantic Repeat\
      \ 7-West (AR7W), un transect de 880 km qui s\u2019\xE9tend de la c\xF4te du\
      \ Labrador jusqu\u2019au c\xF4tes du Groenland et de la ligne Halifax du PMZA\
      \ \xE9tendue par le sud vers la plaine abyssale. Un \xE9chantillonnage opportuniste\
      \ peut \xE9galement avoir lieu dans le d\xE9troit de Belle Ilse, \xE0 la station\
      \ 27, sur le plateau du Labrador et  la ligne 53 nord de OSNAP et en appuie\
      \ \xE0 d\u2019autres programmes ancillaires. L'\xE9chantillonnage du PMZAO est\
      \ effectu\xE9 selon les standard du programme Global Ocean Ship-based Hydrographic\
      \ Investigations Program (GO-SHIP) (https://www.go-ship.org/HydroMan.html) et\
      \ comprend : 1- la collecte de profils CTD et LADCP et d'\xE9chantillons d'eau\
      \ pour la d\xE9termination des caract\xE9ristiques physiques (p. ex. T, S, courants),\
      \ chimiques (p. ex. , nutriments, pH, gaz traces d\xE9termination de la masse\
      \ et/ou pour estimer la ventilation et de s\xE9questration du carbone) et biologiques\
      \ (p. ex. chl-a, production primaire et propri\xE9t\xE9s optiques) ; 2- traits\
      \ de filets conique verticaux et stratifi\xE9s pour les mesures d\u2019abondance\
      \ et la description de la communaut\xE9 mesozooplanctonique.  De plus, les bathythermographes\
      \ (XBT), les bou\xE9es Argo sont couramment d\xE9ploy\xE9s et l'ADCP embarqu\xE9\
      \ sont utilis\xE9s pour d\xE9terminer la structure de la colonne d\u2019eau\
      \ \xE0 plus petite \xE9chelle. Les donn\xE9es recueillies sont synth\xE9tis\xE9\
      es dans des rapports annuels sur les changements physiques, chimiques et biologiques\
      \ dans les eaux du Canada atlantique et dans la mer du Labrador. L'accent est\
      \ mis sur les changements d'intensit\xE9 du retournement hivernal des eaux de\
      \ surface et des strates interm\xE9diaire, qui entra\xEEne la formation de masses\
      \ d'eau profonde et fait partie de la circulation thermohaline qui affecte le\
      \ climat mondial. La convection transf\xE8re \xE9galement les gaz atmosph\xE9\
      riques de la surface vers des profondeurs interm\xE9diaires, ce qui r\xE9duit\
      \ le taux d'augmentation du dioxyde de carbone dans l'atmosph\xE8re mais augmente\
      \ l'acidit\xE9 de l'oc\xE9an."
