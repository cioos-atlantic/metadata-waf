identification:
  abstract:
    en: "The Atlantic Zone Monitoring Program (AZMP) was implemented in 1998 with\
      \ the aim of detecting and tracking climate change and variability in the northwest\
      \ Atlantic, evaluating changes in the physical, chemical and biological ocean\
      \ properties and predator-prey dynamics of marine resources, thereby enhancing\
      \ Canada's ability to understand, describe, and forecast the state of the marine\
      \ ecosystem. AZMP's sampling scheme in the Maritimes Region involves oceanographic\
      \ sampling at two high-frequency (biweekly to monthly) fixed coastal stations,\
      \ biannual sampling at stratified-random locations during DFO-led Ecosystem\
      \ Trawl Surveys, biannual sampling along fixed cross-shelf sections (Cabot Strait\
      \ Line, Louisbourg Line, Halifax Line, Browns Bank Line, and the Northeast Channel);\
      \ the latter of which may also include opportunistic sampling at stations in\
      \ the Laurentian Channel, Gulf of Maine, and various Marine Protected Areas\
      \ (MPAs) in support of ancillary research programs and initiatives. In addition\
      \ to the sampling there are regular moorings on the Scotian Shelf mostly along\
      \ the Halifax Line to measure time series physical (e.g., T, S, currents) and\
      \ chemical (e.g., oxygen).  This data is used for comparison with the numerical\
      \ model transport estimates of the Nova Scotia Current off of Halifax.  \n\n\
      The data collected are synthesized into two annual reports on the physical and\
      \ chemical/biological changes in the Maritimes Region, and are also used to\
      \ evaluate changes across the Atlantic zone."
    fr: "Le Programme de surveillance de la zone Atlantique (AZMP) a \xE9t\xE9 mis\
      \ en \u0153uvre en 1998 dans le but de d\xE9tecter et de suivre les changements\
      \ et la variabilit\xE9 climatiques dans l'Atlantique Nord-Ouest, d'\xE9valuer\
      \ les modifications des propri\xE9t\xE9s physiques, chimiques et biologiques\
      \ de l'oc\xE9an et de la dynamique pr\xE9dateur-proie des ressources marines,\
      \ am\xE9liorant ainsi la capacit\xE9 du Canada \xE0 comprendre, d\xE9crire et\
      \ pr\xE9voir l'\xE9tat de l'\xE9cosyst\xE8me marin. Le programme d'\xE9chantillonnage\
      \ de l'AZMP dans la r\xE9gion des Maritimes comprend l'\xE9chantillonnage oc\xE9\
      anographique \xE0 deux stations c\xF4ti\xE8res fixes \xE0 haute fr\xE9quence\
      \ (toutes les deux semaines ou tous les mois), l'\xE9chantillonnage semestriel\
      \ \xE0 des emplacements al\xE9atoires stratifi\xE9s dans le cadre de relev\xE9\
      s \xE9cosyst\xE9miques au chalut men\xE9s par le minist\xE8re des P\xEAches\
      \ et Oc\xE9ans, l'\xE9chantillonnage semestriel le long de sections transversales\
      \ fixes (ligne du d\xE9troit de Cabot, ligne de Louisbourg, ligne Halifax, ligne\
      \ Browns Bank et chenal du Nord-Est)\_; ce dernier peut \xE9galement inclure\
      \ un \xE9chantillonnage opportuniste dans les stations des Laurentides Canal\
      \ de San, golfe du Maine et diverses aires marines prot\xE9g\xE9es (AMP) \xE0\
      \ l'appui d'installations auxiliaires programmes et initiatives de recherche.\
      \ Outre l'\xE9chantillonnage, des mouillages r\xE9guliers sont install\xE9s\
      \ sur le plateau n\xE9o-\xE9cossais, principalement le long de la ligne Halifax,\
      \ pour mesurer des s\xE9ries chronologiques physiques (par exemple, T, S, courants)\
      \ et chimiques (par exemple, oxyg\xE8ne). Ces donn\xE9es sont utilis\xE9es \xE0\
      \ des fins de comparaison avec les estimations du transport par mod\xE8le num\xE9\
      rique du courant de la Nouvelle-\xC9cosse au large de Halifax. \n\nLes donn\xE9\
      es recueillies sont synth\xE9tis\xE9es dans deux rapports annuels sur les changements\
      \ physiques, chimiques et biologiques dans la r\xE9gion des Maritimes, et sont\
      \ \xE9galement utilis\xE9es pour \xE9valuer les changements dans la zone Atlantique."
