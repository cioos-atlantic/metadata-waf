identification:
  abstract:
    en: "Rapid Climate Change (RAPID) was originally a \xA320 million, six-year (2001-2007)\
      \ program of the Natural Environment Research Council. This monitoring effort\
      \ was continued in the NERC-funded follow-on program RAPID-WATCH 2008-2014.\
      \  The program aimed to improve the ability to quantify the probability and\
      \ magnitude of future rapid change in climate, with a main (but not exclusive)\
      \ focus on the role of the Atlantic Ocean's Thermohaline Circulation. The  program\
      \ used a combination of observations (present day and palaeo) and modelling\
      \ (atmospheric, oceanic, terrestrial, cryospheric). Observations such as moorings\
      \ were used for testing simulations of Thermohaline Circulation variability\
      \ and climate change including the Atlantic meridional overturning circulation,\
      \ long-term transports and mixing processes and atmospheric forcing of ocean\
      \ convection, and large-scale ocean transports. \n\nThe specific scientific\
      \ objectives of the RAPID program were agreed by the Rapid Climate Change Steering\
      \ Committee and are detailed in the RAPID Science Plan (https://rapid.ac.uk/rapid/Scienceplan.php).\n\
      \nIn the Maritimes the Rapid moorings were mostly on the Scotian shelf and slope\
      \ off of Halifax from 2004 to 2010."
    fr: "Rapid Climate Change (RAPID) \xE9tait \xE0 l'origine un programme de 20 millions\
      \ de livres sterling sur six ans (2001-2007) du Natural Environment Research\
      \ Council. Cet effort de suivi s'est poursuivi dans le cadre du programme de\
      \ suivi RAPID-WATCH 2008-2014 financ\xE9 par le NERC. Le programme visait \xE0\
      \ am\xE9liorer la capacit\xE9 de quantifier la probabilit\xE9 et l'ampleur des\
      \ futurs changements rapides du climat, en mettant l'accent (mais pas exclusivement)\
      \ sur le r\xF4le de la circulation thermohaline de l'oc\xE9an Atlantique. Le\
      \ programme a utilis\xE9 une combinaison d'observations (actuelles et pal\xE9\
      o) et de mod\xE9lisation (atmosph\xE9rique, oc\xE9anique, terrestre, cryosph\xE9\
      rique). Des observations telles que des amarrages ont \xE9t\xE9 utilis\xE9es\
      \ pour tester des simulations de la variabilit\xE9 de la circulation thermohaline\
      \ et du changement climatique, y compris la circulation de renversement m\xE9\
      ridienne de l'Atlantique, les processus de transport et de m\xE9lange \xE0 long\
      \ terme, le for\xE7age atmosph\xE9rique d\xFB \xE0 la convection oc\xE9anique,\
      \ ainsi que les transports oc\xE9aniques \xE0 grande \xE9chelle. \n\nLes objectifs\
      \ scientifiques sp\xE9cifiques du programme RAPID ont \xE9t\xE9 approuv\xE9\
      s par le comit\xE9 directeur sur le changement climatique rapide et sont d\xE9\
      taill\xE9s dans le plan scientifique RAPID (https://rapid.ac.uk/rapid/Scienceplan.php).\n\
      \nDans les Maritimes, les mouillages du Rapid se trouvaient principalement sur\
      \ le plateau n\xE9o-\xE9cossais et sur la pente au large d'Halifax de 2004 \xE0\
      \ 2010."
