identification:
  abstract:
    en: "The Government of Canada is commitment to protect marine mammal populations\
      \ across Canada and has invested in scientific research.  Part of this research\
      \ is to increase our knowledge about the impacts on,  locations, movement, and\
      \ abundance of whales in Canada using passive acoustic monitoring. The Maritime\
      \ Region Cetacean Monitoring Program  uses year-round passive acoustic monitoring\
      \ with moored bottom-mounted hydrophones which include MicroCAT instruments\
      \ measuring conductivity, temperature and pressure. These moorings are placed\
      \ across different areas of the Scotian Shelf, Bay of Fundy and Cabot Strait.\
      \ \n\nThis data set only includes the physical oceanographic time series observations\
      \ from the moored CTD (MicroCAT) including conductivity, temperature and pressure.\
      \  Data collection started 2015 and continues to present. \n\nSeveral projects\
      \ have provided funding for this work including;  Ocean Protection Plan (OPP)\
      \ Whale Detection and Collision Avoidance (OPP-WDCA) project, the National Conservation\
      \ Plan (NCP) Species\_at Risk Act (SARA) project and the Ocean Protection Plan\
      \ (OPP) Marine Environmental Quality (OPP-MEQ).  \n\nlinks include:\nhttps://www.dfo-mpo.gc.ca/species-especes/mammals-mammiferes/whales-baleines/research-recherche-eng.html\
      \ , \nhttps://www.dfo-mpo.gc.ca/species-especes/sara-lep/index-eng.html"
    fr: "Le gouvernement du Canada s'est engag\xE9 \xE0 prot\xE9ger les populations\
      \ de mammif\xE8res marins \xE0 travers le Canada et a investi dans la recherche\
      \ scientifique. Une partie de cette recherche vise \xE0 accro\xEEtre nos connaissances\
      \ sur les impacts sur les baleines au Canada, leur localisation, leurs d\xE9\
      placements et leur abondance gr\xE2ce \xE0 la surveillance acoustique passive.\
      \ Le programme de surveillance des c\xE9tac\xE9s de la r\xE9gion maritime utilise\
      \ une surveillance acoustique passive tout au long de l'ann\xE9e au moyen d'hydrophones\
      \ amarr\xE9s mont\xE9s au fond, qui incluent des instruments MicroCat mesurant\
      \ la conductivit\xE9, la temp\xE9rature et la pression. Ces mouillages sont\
      \ situ\xE9s dans diff\xE9rentes zones du plateau n\xE9o-\xE9cossais, de la baie\
      \ de Fundy et du d\xE9troit de Cabot. \n\nCet ensemble de donn\xE9es inclut\
      \ uniquement les observations de s\xE9ries chronologiques oc\xE9anographiques\
      \ physiques provenant du CTD amarr\xE9 (MicroCAT), y compris la conductivit\xE9\
      , la temp\xE9rature et la pression. La collecte de donn\xE9es a d\xE9but\xE9\
      \ en 2015 et se poursuit. \n\nPlusieurs projets ont financ\xE9 ces travaux,\
      \ notamment le projet de d\xE9tection des baleines et d'\xE9vitement des collisions\
      \ (OPP-WDCA) dans le cadre du Plan de protection des oc\xE9ans (OPP), le projet\
      \ de Loi sur les esp\xE8ces en p\xE9ril (SARA) du Plan national de conservation\
      \ (NCP) et le Plan de protection des oc\xE9ans (OPP) sur la qualit\xE9 du milieu\
      \ marin (OPP-MEQ). \n\nles liens incluent\_:\nhttps://www.dfo-mpo.gc.ca/species-especes/mammals-mammiferes/whales-baleines/research-recherche-eng.html,\
      \ \nhttps://www.dfo-mpo.gc.ca/species-especes/sara-lep/index-eng.html"
