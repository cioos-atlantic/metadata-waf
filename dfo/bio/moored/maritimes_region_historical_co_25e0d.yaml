identification:
  abstract:
    en: Historical coastal missions in which DFO Bedford Institute of Oceanography
      participated in between 1970s and present which collected moored time series
      data. These missions were part of various projects in several coastal areas
      around Nova Scotia and southern New Brunswick.
    fr: "Missions c\xF4ti\xE8res historiques auxquelles l'Institut oc\xE9anographique\
      \ de Bedford de P\xEAches et Oc\xE9ans Canada a particip\xE9 entre les ann\xE9\
      es 1970 et aujourd'hui, qui ont permis de recueillir des donn\xE9es chronologiques\
      \ amarr\xE9es. Ces missions s'inscrivaient dans le cadre de divers projets dans\
      \ plusieurs zones c\xF4ti\xE8res de la Nouvelle-\xC9cosse et du sud du Nouveau-Brunswick."
