identification:
  abstract:
    en: 'The Barrow Strait flow observational program started in 1998 and continued
      for 13 years to 2012.  This was followed by the Barrow Strait Real Time Observatory
      Project until 2016, afterwards the project is a combination of both projects
      and called Maritimes Region Barrow Strait Monitoring Program.


      Barrow Strait is the widest of the 4 passages through the Canadian Archipelago
      making it an important monitoring location.  The program explores the magnitude
      and variability of freshwater, heat and volume transports through the eastern
      Northwest Passage. The data measured included: profile CTD and time series temperature,
      salinity, density, currents, ice draft and ice drift velocity. The time series
      data collected was used to quantify the freshwater discharge from the Arctic
      Ocean through Barrow Strait into the northwest Atlantic, and link variability
      in this freshwater outflow to large scale weather patterns. Annual analysis
      performed on the collected data include: low-pass filtering, power spectra,
      progressive vector diagram, tidal analyses, seasonal and monthly averaged stats,
      mean flow, and ice velocities.  Data from the program, along with a description
      of the methods used, have been published annually up to 2015 in the Canadian
      Data Report of Hydrography and Ocean Sciences report number 190 to 195, 173,
      167, 166, 165, 161, and 157.


      An ocean observatory was installed at the eastern end of the Northwest Passage
      in 2009 to provide hourly ocean and ice conditions for use by mariners and climate
      modellers.  Data from instrumented moorings are acoustically transmitted to
      a "data hub" at the offshore end of an underwater cable, sent through the cable,
      and then transmitted from the shore station by Iridium satellite for access
      on the web (https://www.bio.gc.ca/science/newtech-technouvelles/observatory-observatoire-en.php)'
    fr: "Le programme d'observation du d\xE9bit du d\xE9troit de Barrow a d\xE9but\xE9\
      \ en 1998 et s'est poursuivi pendant 13 ans, jusqu'en 2012. Cela a \xE9t\xE9\
      \ suivi par le projet d'observatoire en temps r\xE9el du d\xE9troit de Barrow\
      \ jusqu'en 2016, puis le projet est une combinaison des deux projets et a \xE9\
      t\xE9 baptis\xE9 Programme de surveillance du d\xE9troit de Barrow dans la r\xE9\
      gion des Maritimes.\n\nLe d\xE9troit de Barrow est le plus large des quatre\
      \ passages de l'archipel canadien, ce qui en fait un lieu de surveillance important.\
      \ Le programme explore l'ampleur et la variabilit\xE9 des transports d'eau douce,\
      \ de chaleur et de volume par l'est du passage du Nord-Ouest. Les donn\xE9es\
      \ mesur\xE9es comprenaient\_: le profil CTD et les s\xE9ries chronologiques\
      \ de temp\xE9rature, de salinit\xE9, de densit\xE9, de courants, de tirant d'eau\
      \ et de vitesse de d\xE9rive des glaces. Les donn\xE9es chronologiques collect\xE9\
      es ont \xE9t\xE9 utilis\xE9es pour quantifier le d\xE9bit d'eau douce de l'oc\xE9\
      an Arctique par le d\xE9troit de Barrow dans l'Atlantique nord-ouest, et \xE9\
      tablir un lien entre la variabilit\xE9 de ce d\xE9bit sortant d'eau douce et\
      \ les conditions m\xE9t\xE9orologiques \xE0 grande \xE9chelle. Les analyses\
      \ annuelles effectu\xE9es sur les donn\xE9es collect\xE9es incluent\_: le filtrage\
      \ passe-bas, les spectres de puissance, le diagramme vectoriel progressif, les\
      \ analyses des mar\xE9es, les statistiques moyennes saisonni\xE8res et mensuelles,\
      \ le d\xE9bit moyen et la vitesse des glaces. Les donn\xE9es du programme, ainsi\
      \ qu'une description des m\xE9thodes utilis\xE9es, ont \xE9t\xE9 publi\xE9es\
      \ chaque ann\xE9e jusqu'en 2015 dans le rapport de donn\xE9es canadiennes sur\
      \ l'hydrographie et les sciences oc\xE9aniques num\xE9ros 190 \xE0 195, 173,\
      \ 167, 166, 165, 161 et 157.\n\nUn observatoire oc\xE9anique a \xE9t\xE9 install\xE9\
      \ \xE0 l'extr\xE9mit\xE9 est du passage du Nord-Ouest en 2009 pour fournir des\
      \ informations horaires sur l'\xE9tat de l'oc\xE9an et des glaces \xE0 l'intention\
      \ des navigateurs et des mod\xE9lisateurs climatiques. Les donn\xE9es provenant\
      \ d'amarrages instrument\xE9s sont transmises acoustiquement \xE0 un \xAB\_\
      hub de donn\xE9es\_\xBB situ\xE9 \xE0 l'extr\xE9mit\xE9 offshore d'un c\xE2\
      ble sous-marin, puis envoy\xE9es par le c\xE2ble, puis transmises depuis la\
      \ station c\xF4ti\xE8re par le satellite Iridium pour \xEAtre consult\xE9es\
      \ sur le Web (https://www.bio.gc.ca/science/newtech-technouvelles/observatory-observatoire-en.php)"
