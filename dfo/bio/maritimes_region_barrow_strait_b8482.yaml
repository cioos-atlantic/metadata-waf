identification:
  abstract:
    en: 'The Barrow Strait flow observational program started in 1998 and continued
      for 13 years to 2012. Barrow Strait is the widest of the 4 passages through
      the Canadian Archipelago making it an important monitoring location.  The program
      explores the magnitude and variability of freshwater, heat and volume transports
      through the eastern Northwest Passage. The data measured included: profile CTD
      and time series temperature, salinity, density, currents, ice draft and ice
      drift velocity. The time series data collected was used to quantify the freshwater
      discharge from the Arctic Ocean through Barrow Strait into the northwest Atlantic,
      and link variability in this freshwater outflow to large scale weather patterns.
      Annual analysis performed on the collected data include: low-pass filtering,
      power spectra, progressive vector diagram, tidal analyses, seasonal and monthly
      averaged stats, mean flow, and ice velocities.  Data from the program, along
      with a description of the methods used, have been published annually in the
      Canadian Data Report of Hydrography and Ocean Sciences report number 190 to
      195, 173, 167, 166, 165, 161, and 157.'
    fr: "Le programme d'observation du climat oc\xE9anique du d\xE9troit de Barrow\
      \ a d\xE9but\xE9 en 1998 et s'est poursuivi pendant 13 ans jusqu'en 2012. Le\
      \ d\xE9troit de Barrow est le plus large des quatre passages de l'archipel canadien,\
      \ ce qui en fait un lieu de surveillance important. Le programme explore l'ampleur\
      \ et la variabilit\xE9 des transports d'eau douce, de chaleur et de volume dans\
      \ le passage du Nord-Ouest est. Les donn\xE9es mesur\xE9es comprenaient\_: la\
      \ CTD du profil et la temp\xE9rature des s\xE9ries chronologiques, la salinit\xE9\
      , la densit\xE9, les courants, le tirage de la glace et la vitesse de d\xE9\
      rive de la glace Les donn\xE9es de s\xE9ries chronologiques recueillies ont\
      \ \xE9t\xE9 utilis\xE9es pour quantifier le d\xE9bit d'eau douce de l'oc\xE9\
      an Arctique \xE0 travers le d\xE9troit de Barrow dans l'Atlantique nord-ouest,\
      \ et relier la variabilit\xE9 de cet \xE9coulement d'eau douce aux r\xE9gimes\
      \ m\xE9t\xE9orologiques \xE0 grande \xE9chelle. Les analyses annuelles effectu\xE9\
      es sur les donn\xE9es collect\xE9es comprennent\_: le filtrage passe-bas, les\
      \ spectres de puissance, le diagramme vectoriel progressif, les analyses des\
      \ mar\xE9es, les statistiques moyennes saisonni\xE8res et mensuelles, le d\xE9\
      bit moyen et les vitesses des glaces. Les donn\xE9es du programme, ainsi qu'une\
      \ description des m\xE9thodes utilis\xE9es, ont \xE9t\xE9 publi\xE9es chaque\
      \ ann\xE9e dans le rapport no 190 \xE0 195, 173, 167, 166, 165, 161 et 157 du\
      \ Canadian Data Report of Hydrography and Ocean Sciences."
