  use_constraints:
    limitations:
      en: "Availability of data varies both between and within years due to mission\
        \ cancellations. \n\nSensors are calibrated regularly by the manufacturer,\
        \ however individual profiles have not been post-calibrated with water sample\
        \ data (dissolved oxygen, salinity, fluorescence, etc.).\n\nMeteorological\
        \ data is from shipboard observations and has not been verified. No QA/QC\
        \ has been performed on the meteorological data.\n\nData collected during\
        \ the summer 2024 AZMP survey (CAB054) has a potential issue with the primary\
        \ and secondary conductivity sensors (and derived data) which is being investigated.\
        \ Use this data with caution."
      fr: "La disponibilité des données varie d'une année à l'autre en raison des\
        \ annulations de missions. \n\nLes capteurs sont étalonnés régulièrement par\
        \ le fabricant, mais les profils individuels n'ont pas été post-étalonnés\
        \ avec les données des échantillons d'eau (oxygène dissous, salinité, fluorescence,\
        \ etc.).\n\nLes données météorologiques proviennent d'observations à bord\
        \ des navires et n'ont pas été vérifiées. Aucun AQ/CQ n'a été effectué sur\
        \ les données météorologiques.\n\nLes données collectées lors de l'enquête\
        \ AZMP de l'été 2024 (CAB054) présentent un problème potentiel avec les capteurs\
        \ de conductivité primaires et secondaires (et les données dérivées) qui sont\
        \ à l'étude. Utilisez ces données avec prudence."
      translations:
        fr:
          message: text translated using the Amazon translate service / texte traduit
            à l'aide du service de traduction Amazon
          verified: false
