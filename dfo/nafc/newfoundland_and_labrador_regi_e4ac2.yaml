identification:
  title:
    en: Newfoundland and Labrador Region Atlantic Zone Monitoring Program (AZMP) Rosette
      Vertical Profiles
    fr: Profils verticaux des rosettes du Programme de monitorage de la zone Atlantique
      (PMZA) de la région de Terre-Neuve-et-Labrador
    translations:
      fr:
        message: text translated using the Amazon translate service / texte traduit
          à l'aide du service de traduction Amazon
        verified: false
  abstract:
    en: The Atlantic Zone Monitoring Program (AZMP) was implemented in 1998 with the
      aim of detecting and tracking climate change and variability in the northwest
      Atlantic, evaluating changes in the physical, chemical and biological ocean
      properties and predator-prey dynamics of marine resources, thereby enhancing
      Canada's ability to understand, describe, and forecast the state of the marine
      ecosystem. AZMP's sampling scheme in the Newfoundland and Labrador Region involves
      oceanographic sampling at one high-frequency (biweekly to monthly) fixed coastal
      station (Station 27) as well as triannual sampling along fixed cross-shelf sections
      (Beachy Island, Makkovik Bank, Seal Island, White Bay, Bonavista Bay, Flemish
      Cap, Southeast Grand Banks, Southeast St. Pierre Bank and Southwest St. Pierre
      Bank). AZMP sampling is conducted according to standard procedures (see https://cat.fsl-bsf.scitech.gc.ca/record=b3951030~S6)
      and includes the collection of CTD profiles and water samples for the determination
      of physical (e.g., T, S), chemical (e.g., nutrients, carbonates, oxygen, pH),
      and biological (e.g., chl a) variables and vertical ring net tows. The data
      collected are synthesized into two annual reports on the physical and chemical/biological
      changes in the Newfoundland and Labrador Region, contribute to multiple Canadian
      Science Advisory Secretariat (CSAS) and Northwest Atlantic Fisheries Organization
      (NAFO) processes, and are also used to evaluate changes across the Atlantic
      zone.
    fr: Le Programme de monitorage de la zone Atlantique (PMZA) a été mis en œuvre
      en 1998 dans le but de détecter et de suivre le changement climatique et la
      variabilité dans l'Atlantique Nord-Ouest, d'évaluer les changements dans les
      propriétés physiques, chimiques et biologiques de l'océan ainsi que la dynamique
      prédateur-proie des ressources marines, améliorant ainsi la capacité du Canada
      à comprendre, décrire et prévoir l'état de l'écosystème marin. Le plan d'échantillonnage
      de le PMZA dans la région de Terre-Neuve-et-Labrador comprend un échantillonnage
      océanographique dans une station côtière fixe à haute fréquence (bihebdomadaire
      ou mensuelle) (station 27) ainsi qu'un échantillonnage triennal le long de sections
      transversales fixes (Île Beachy, Banc de Makkovik, Île Seal, Baie Blanche, Baie
      de Bonavista, Bonnet Flamand, Sud-Est des Grands Bancs, Sud-Est des Banc de
      Saint-Pierre et Sud-Ouest des Banc de Saint-Pierre). L'échantillonnage de le
      PMZA est effectué conformément aux procédures standard (voir https://cat.fsl-bsf.scitech.gc.ca/record=b3951030~S6)
      et comprend la collecte de profils CTD et d'échantillons d'eau pour la détermination
      de variables physiques (par exemple, T, S), chimiques (par exemple, nutriments,
      carbonates, oxygène, pH) et biologiques (par exemple, chl a) et de traceurs
      à filets annulaires verticaux. Les données recueillies sont synthétisées dans
      deux rapports annuels sur les changements physiques, chimiques et biologiques
      dans la région de Terre-Neuve-et-Labrador, contribuent à de nombreux processus
      du Secrétariat canadien des avis scientifiques (SCAS) et de l'Organisation des
      pêches de l'Atlantique Nord-Ouest (OPANO), et sont également utilisées pour
      évaluer les changements dans la zone Atlantique.
