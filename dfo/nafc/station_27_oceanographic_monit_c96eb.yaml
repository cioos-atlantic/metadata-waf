identification:
  title:
    en: Station 27 Oceanographic Monitoring Station
    fr: Station 27 Station de surveillance océanographique
    translations:
      fr:
        message: text translated using the Amazon translate service / texte traduit
          à l'aide du service de traduction Amazon
        verified: false
  abstract:
    en: 'Station 27 (47° 32.8'' N, 52° 35.2'' W) was established in 1946 as the first
      hydrographic monitoring station in the standard St. John''s to Flemish Cap transect
      and is the most frequently sampled site in Newfoundland and Labrador waters.
      Located approximately 7 km off St. John''s harbour in a water depth of 176m
      this station was intentionally located in the Avalon Channel to monitor the
      water properties of the inshore branch of the Labrador current which are representative
      of conditions across a broad area of the Newfoundland Shelf. Data was first
      collected at Station 27 in 1946 and the station was sampled regularly ever since,
      making it one of the longest hydrographic monitoring stations in the world.
      In recent years, Station 27 has been sampled about 2 - 4 times per month on
      average, primarily by oceanographic and fisheries research vessels, as part
      of the Atlantic Zone Monitoring Program (AZMP).


      Due to the length of the hydrographic time series at Station 27 sampling methods
      vary, and include instrumentation such as water-sampling bottles equipped with
      reversing thermometers, mechanical and electronic bathythermographs, and more
      recently conductivity-temperature-depth (CTD) recorders have been used extensively.
      Therefore the accuracy of the data varies depending on which data collection
      method was used.


      In recent years, data collection at Station 27 has expanded to include a year-round
      high-resolution temperature-salinity mooring, an acoustic zooplankton fish profiler
      (AZFP) mooring which is deployed for 9 months each year from November - July,
      and a Viking buoy (AZMP-STA27) equipped with meteorological and surface oceanographic
      sensor suite, as well as a profiling CTD winch, which is deployed in late-spring
      through mid-fall.'
    fr: 'La station 27 (47° 32,8'' N, 52° 35,2'' O) a été créée en 1946 en tant que
      première station de surveillance hydrographique dans le transect standard de
      St. John''s au Cap flamand et constitue le site le plus fréquemment échantillonné
      dans les eaux de Terre-Neuve-et-Labrador. Située à environ 7 km du port de St.
      John''s, à une profondeur de 176 m, cette station a été délibérément installée
      dans le chenal d''Avalon afin de surveiller les propriétés de l''eau de la branche
      côtière du courant du Labrador, qui sont représentatives des conditions régnant
      sur une vaste partie du plateau de Terre-Neuve. Les données ont été recueillies
      pour la première fois à la station 27 en 1946 et la station a été échantillonnée
      régulièrement depuis, ce qui en fait l''une des plus longues stations de surveillance
      hydrographique au monde. Ces dernières années, la station 27 a été échantillonnée
      environ 2 à 4 fois par mois en moyenne, principalement par des navires de recherche
      océanographique et halieutique, dans le cadre du Programme de monitorage de
      la zone Atlantique (PMZA).


      En raison de la longueur des séries chronologiques hydrographiques de la station
      27, les méthodes d''échantillonnage varient et comprennent des instruments tels
      que des bouteilles d''échantillonnage d''eau équipées de thermomètres inversés,
      des bathythermographes mécaniques et électroniques et, plus récemment, des enregistreurs
      de conductivité-température-profondeur (CTD) ont été largement utilisés. Par
      conséquent, la précision des données varie en fonction de la méthode de collecte
      de données utilisée.


      Ces dernières années, la collecte de données à la Station 27 s''est étendue
      pour inclure un dispositif d''amarrage haute résolution couvrant la température
      et la salinité tout au long de l''année, un dispositif d''amarrage acoustique
      pour zooplancton (AZFP) déployé pendant 9 mois par an de novembre à juillet,
      une bouée Viking (AZMP-STA27) équipée d''une suite de capteurs météorologiques
      et océanographiques de surface, ainsi qu''un treuil CTD de profilage, qui est
      déployé de la fin du printemps au milieu du printemps chute.'
