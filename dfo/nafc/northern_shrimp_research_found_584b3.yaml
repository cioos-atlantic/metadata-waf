identification:
  title:
    en: Northern Shrimp Research Foundation (NSRF) CTD Profiles
    fr: Profils CTD de la Northern Shrimp Research Foundation (NSRF)
    translations:
      fr:
        message: text translated using the Amazon translate service / texte traduit
          à l'aide du service de traduction Amazon
        verified: false
  abstract:
    en: 'The Northern Shrimp Research Foundation (NSRF) was established in 2002 to
      address gaps in scientific data and research in the North in collaboration with
      the Department of Fisheries and Oceans Canada (DFO). The NSRF conducts shrimp
      research surveys in the Eastern Assessment zone (EAZ) and Western Assessment
      zone (WAZ). Using a DFO designed shock-absorbing CTD sled containing a Seabird
      model SBE-19plus CTD the NSRF shrimp surveys collect physical oceanographic
      data (e.g., T, S) at each fishing set since 2005. The package attached to the
      trawl head-ropes records time, water pressure, temperature, and conductivity
      for the duration of the fishing set.


      In addition, the NSRF survey collects CTD data and water samples from vertical
      rosette profiles since 2022 in collaboration with the Atlantic Zone Monitoring
      Program (AZMP). This sampling is conducted according to standard procedures
      developed by AZMP and includes the collection of CTD profiles and water samples
      for the determination of physical (e.g., T, S), chemical (e.g., nutrients),
      and biological (chl a) variables and vertical ring net tows.


      This record includes data that is collected from surveys jointly conducted by
      the Department of Fisheries and Oceans Canada (DFO) and the Northern Shrimp
      Research Foundation (NSRF) from 2005 to present.'
    fr: 'La Northern Shrimp Research Foundation (NSRF) a été créée en 2002 pour combler
      les lacunes en matière de données scientifiques et de recherche dans le Nord
      en collaboration avec le ministère des Pêches et des Océans du Canada (MPO).
      La NSRF mène des études de recherche sur les crevettes dans la zone d''évaluation
      est (EAZ) et la zone d''évaluation ouest (WAZ). À l''aide d''un traîneau CTD
      absorbant les chocs conçu par le MPO et contenant un CTD Seabird modèle SBE-19plus,
      les relevés sur les crevettes de la NSRF permettent de recueillir des données
      océanographiques physiques (par exemple, T, S) pour chaque zone de pêche depuis
      2005. L''emballage attaché aux câbles à tête de chalut enregistre le temps,
      la pression de l''eau, la température et la conductivité pendant toute la durée
      du set de pêche.


      En outre, l''enquête NSRF collecte des données CTD et des échantillons d''eau
      à partir de profils de rosettes verticales depuis 2022 en collaboration avec
      le Programme de monitorage de la zone atlantique (PMZA). Cet échantillonnage
      est effectué conformément aux procédures standard développées par le PMZA et
      comprend la collecte de profils CTD et d''échantillons d''eau pour la détermination
      des variables physiques (par exemple, T, S), chimiques (par exemple, nutriments)
      et biologiques (chl a) et des tracés verticaux en filet annulaire.


      Ce dossier comprend des données recueillies à partir de relevés menés conjointement
      par le ministère des Pêches et des Océans du Canada (MPO) et la Northern Shrimp
      Research Foundation (NSRF) de 2005 à aujourd''hui.'
