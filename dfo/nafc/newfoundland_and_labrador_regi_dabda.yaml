    limitations:
      en: "Availability of data varies both between and within years due to mission\
        \ cancellations. \n\nLatitude/longitude is recorded at the start of the fishing\
        \ tow. End position is not recorded in the CTD data.\n\nMeteorological data\
        \ is from shipboard observations and has not been verified. No QA/QC has been\
        \ performed on the meteorological data."
      fr: "La disponibilité des données varie d'une année à l'autre en raison des\
        \ annulations de missions. \n\nLa latitude/longitude est enregistrée au départ\
        \ du câble de pêche. La position finale n'est pas enregistrée dans les données\
        \ CTD.\n\nLes données météorologiques proviennent d'observations à bord des\
        \ navires et n'ont pas été vérifiées. Aucun AQ/CQ n'a été effectué sur les\
        \ données météorologiques."
