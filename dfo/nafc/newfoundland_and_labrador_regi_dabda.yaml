identification:
  title:
    en: Newfoundland and Labrador Region Multi-Species Survey Trawl-Mounted CTD Profiles
    fr: Profils CTD montés au chalut dans le cadre du relevé multi-spécifiques de
      la région de Terre-Neuve-et-Labrador
    translations:
      fr:
        message: text translated using the Amazon translate service / texte traduit
          à l'aide du service de traduction Amazon
        verified: false
  abstract:
    en: "The Department of Fisheries and Oceans Canada (DFO), Newfoundland and Labrador\
      \ Region, has undertaken stratified-random multi-species surveys in portions\
      \ of Northwest Atlantic Fisheries Organization (NAFO) subareas 2 and 3 since\
      \ the early 1970’s. The current survey design covers an expansive spatial area,\
      \ spanning six NAFO divisions (2HJ3KLNO) and 515,000 km2 in the autumn and four\
      \ NAFO divisions (3LNOP) and 324,000 km2 in the spring. The survey aims at determining\
      \ the distribution and abundance of commercial and non-commercial fish and invertebrate\
      \ species with respect to position, depth, and temperature, and to collect biological\
      \ samples. \n\nIn 1989 DFO developed a shock-absorbing CTD sled containing a\
      \ Seabird model SBE-19 CTD that could be mounted on a trawl, which is now the\
      \ primary instrument used to collect physical oceanographic data (e.g., T, S)\
      \ during multi-species surveys in NL region. The package attached to the trawl\
      \ head-ropes records time, water pressure, temperature, and conductivity for\
      \ the duration of the fishing set. In the event of instrument failure an expendable\
      \ bathythermograph (XBT) is deployed.\n\nIn addition, this survey samples the\
      \ high-frequency station, Station 27, in collaboration with the Atlantic Zone\
      \ Monitoring Program (AZMP).\n\nThis record includes only hydrographic/CTD data\
      \ collected during the spring and autumn multi-species surveys, conducted between\
      \ 1995 to present."
    fr: "Le ministère des Pêches et des Océans du Canada (MPO), région de Terre-Neuve-et-Labrador,\
      \ a entrepris des relevés multi-spécifiques aléatoires stratifiés dans certaines\
      \ parties des sous-zones 2 et 3 de l'Organisation des pêches de l'Atlantique\
      \ Nord-Ouest (OPANO) depuis le début des années 1970. Le plan actuel couvre\
      \ une vaste zone spatiale, couvrant six divisions de l'OPANO (2HJ3KLNO) et 515\
      \ 000 km2 à l'automne et quatre divisions de l'OPANO (3LNOP) et 324 000 km2\
      \ dans printemps. L'étude vise à déterminer la distribution et l'abondance des\
      \ espèces de poissons et d'invertébrés commerciales et non commerciales en termes\
      \ de position, de profondeur et de température, et à collecter des échantillons\
      \ biologiques. \n\nEn 1989, le MPO a mis au point un traîneau CTD absorbant\
      \ les chocs contenant un Seabird modèle SBE-19 CTD qui pouvait être monté sur\
      \ un chalut, qui est maintenant le principal instrument utilisé pour recueillir\
      \ des données océanographiques physiques (par exemple, T, S) lors de relevés\
      \ multi-spécifiques dans la région de Terre-Neuve-et-Labrador. L'emballage attaché\
      \ aux câbles à tête de chalut enregistre le temps, la pression de l'eau, la\
      \ température et la conductivité pendant toute la durée du set de pêche. En\
      \ cas de défaillance de l'instrument, un bathythermographe consommable (XBT)\
      \ est déployé.\n\nEn outre, cette étude échantillonne la station haute fréquence,\
      \ Station 27, en collaboration avec le Programme de monitorage de la zone Atlantique\
      \ (PMZA).\n\nCe registre comprend uniquement les données hydrographiques/CTD\
      \ collectées lors des relevés multi-spécifiques du printemps et de l'automne,\
      \ menés entre 1995 et aujourd'hui."
