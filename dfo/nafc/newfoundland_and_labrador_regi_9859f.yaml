    limitations:
      en: 'For data collected during fisheries surveys, latitude/longitude is recorded
        at the start of the fishing tow. End position is not recorded in the CTD data.


        Meteorological data is from shipboard observations and has not been verified.
        No QA/QC has been performed on the meteorological data.'
      fr: 'Pour les données collectées lors des enquêtes de pêche, la latitude/longitude
        est enregistrée au début de la ligne de pêche. La position finale n''est pas
        enregistrée dans les données CTD.


        Les données météorologiques proviennent d''observations à bord des navires
        et n''ont pas été vérifiées. Aucun AQ/CQ n''a été effectué sur les données
        météorologiques.'
