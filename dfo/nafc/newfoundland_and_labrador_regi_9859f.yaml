identification:
  title:
    en: Newfoundland and Labrador Region Hydrographic Data Collection 1980 - Present
    fr: Collecte de données hydrographiques de la région de Terre-Neuve-et-Labrador
      1980 à aujourd'hui
    translations:
      fr:
        message: text translated using the Amazon translate service / texte traduit
          à l'aide du service de traduction Amazon
        verified: false
  abstract:
    en: This dataset contains hydrographic data collected by the Department of Fisheries
      and Oceans Canada, Newfoundland and Labrador Region, from 1980 - present. This
      data was collected as part of various projects, including both inshore and offshore
      locations across the Newfoundland and Labrador shelf. Examples of projects which
      undertook this data collection include studies involving fisheries resources,
      biological and physical oceanography, shellfish, groundfish tagging, Sentinel
      Cod, acoustic calibrations, pelagic resources, as well as opportunistic sampling
      from ships of opportunity, among others.
    fr: Cet ensemble de données contient des données hydrographiques recueillies par
      le ministère des Pêches et des Océans du Canada, région de Terre-Neuve-et-Labrador,
      de 1980 à aujourd'hui. Ces données ont été recueillies dans le cadre de divers
      projets, notamment sur des sites côtiers et extracôtiers sur le plateau continental
      de Terre-Neuve-et-Labrador. Parmi les projets qui ont entrepris cette collecte
      de données, citons des études portant sur les ressources halieutiques, l'océanographie
      biologique et physique, les mollusques, le marquage des poissons de fond, la
      morue sentinelle, les étalonnages acoustiques, les ressources pélagiques, ainsi
      que l'échantillonnage opportuniste à partir de navires d'opportunité, entre
      autres.
    translations:
      fr:
        message: text translated using the Amazon translate service / texte traduit
          à l'aide du service de traduction Amazon
        verified: false
