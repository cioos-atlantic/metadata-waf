    limitations:
      en: 'The data are taken from in situ measurement campaigns. Outliers may occur:

        • in case of waveform collision or manipulation;

        • if the equipment is at its autonomy limit;

        • in case of system failure;

        A number of tests are carried out to limit these values influence but the
        result cannot be guaranteed.

        In storms event, transmission and/or autonomy problems may cause measures
        interruption.

        The measurements non-homogeneous distribution over time may give more weight
        to a particular period in the results of global statistical analyses (quantiles,
        histograms, correlogram, …)

        The devices used are wave measuring buoys (Datawell, Triaxys, ...). Manufacturers
        specify a accuracy between 0.5% and 3% depending on the type and age of the
        material.

        The uncertainty on the sea state calculations parameters depends on the number
        of waves identified.'
      fr: 'Les données sont issues des campagnes de mesure in situ. Des valeurs aberrantes
        peuvent apparaître :

        • en cas de collision ou manipulation du houlographe ;

        • si le matériel est en limite d''autonomie ;

        • en cas de défaillance du système ;


        Un certain nombre de tests est effectué afin de limiter l''influence de ces
        valeurs mais le résultat ne peut être garanti.

        En cas de tempêtes, des problèmes de transmission et/ou d''autonomie peuvent
        engendrer une interruption des mesures.

        La répartition non homogène dans le temps des mesures peut donner plus de
        poids à une période particulière dans les résultats d''analyses statistiques
        globales (quantiles, histogrammes, corrélogramme, …).

        Les appareils utilisés sont des bouées de mesure de houle (Datawell, Triaxys,
        …). Les constructeurs spécifient une précision comprise entre 0,5% et 3% selon
        le type et l''ancienneté du matériel.'
