identification:
  abstract:
    en: 'CANDHIS is the French national coastal archiving center for in situ wave
      data.


      Its main goal is to promote sea state measurements in the near coastal area
      and to ensure data communication to the scientific community, marine professionals
      and the general public.'
    fr: 'CANDHIS est le Centre d’Archivage National des Données de Houle In Situ.


      Son objectif principal est de promouvoir la mesure des états de mer dans le
      domaine proche côtier et d’assurer la diffusion des données auprès de la communauté
      scientifique, des professionnels de la mer et du grand public.'
